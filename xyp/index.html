<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>阳光跑</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="stage">
      <main class="phone-screen" aria-label="阳光跑页面">
        <div class="status-space" aria-hidden="true"></div>

        <header class="app-header">
          <h1>我</h1>
        </header>

        <section class="page-body">
          <div class="profile-list" aria-label="个人信息和跑步功能">
            <div class="list-row">
              <span>学校</span>
              <strong data-field="school"></strong>
            </div>
            <div class="list-row">
              <span>学号</span>
              <strong data-field="studentId"></strong>
            </div>
            <div class="list-row">
              <span>姓名</span>
              <strong data-field="name"></strong>
            </div>
            <div class="list-row">
              <span>性别</span>
              <strong data-field="gender"></strong>
            </div>
            <div class="list-row">
              <span>身高(厘米)</span>
              <strong>点击设置身高</strong>
            </div>
            <div class="list-row">
              <span>体重(公斤)</span>
              <strong>点击设置体重</strong>
            </div>
            <button class="list-row action-row" type="button">
              <span>下载跑步计划</span>
            </button>
            <button class="list-row action-row" type="button">
              <span>查看跑步计划</span>
            </button>
            <button class="list-row action-row" type="button">
              <span>上传跑步记录</span>
            </button>
            <button class="list-row action-row" type="button" data-action="score">
              <span>查询跑步成绩</span>
            </button>
            <button class="list-row action-row" type="button" data-action="settings">
              <span>设置</span>
            </button>
            <button class="list-row action-row" type="button">
              <span>退出</span>
            </button>
            <button class="list-row action-row about-row" type="button">
              <span>关于飞翔的红蜻蜓</span>
            </button>
          </div>
        </section>

        <nav class="tabbar" aria-label="底部导航">
          <button class="tab-item" type="button" aria-label="运动">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M12 44c10-2 15-8 18-19 2 6 6 9 13 11 7 2 12 6 12 12 0 5-5 8-12 8H19c-6 0-9-4-7-12Z" />
            </svg>
            <span>运动</span>
          </button>
          <button class="tab-item" type="button" aria-label="发现">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="32" r="24" />
              <path d="m39 21-8 17-9 5 8-17 9-5Z" />
            </svg>
            <span>发现</span>
          </button>
          <button class="tab-item active" type="button" aria-label="我">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 31c8 0 13-6 13-14S40 4 32 4 19 10 19 17s5 14 13 14Z" />
              <path d="M11 58c3-14 11-22 21-22s18 8 21 22H11Z" />
            </svg>
            <span>我</span>
          </button>
        </nav>

        <div class="modal-layer" data-modal="score" hidden>
          <article class="dialog-card score-dialog" role="dialog" aria-modal="true" aria-labelledby="score-title">
            <h2 id="score-title">跑步成绩</h2>
            <p data-field="scoreMessage"></p>
            <button class="dialog-confirm" type="button" data-action="close">确定</button>
          </article>
        </div>

        <div class="modal-layer" data-modal="settings" hidden>
          <form class="dialog-card settings-dialog" aria-label="演示资料设置">
            <h2>演示资料</h2>
            <label>
              <span>学校</span>
              <input name="school" autocomplete="off" />
            </label>
            <label>
              <span>学号</span>
              <input name="studentId" inputmode="numeric" autocomplete="off" />
            </label>
            <label>
              <span>姓名</span>
              <input name="name" autocomplete="off" />
            </label>
            <label>
              <span>性别</span>
              <select name="gender">
                <option value="女">女</option>
                <option value="男">男</option>
                <option value="其他">其他</option>
              </select>
            </label>
            <label>
              <span>阳光跑次数</span>
              <input name="runs" inputmode="numeric" autocomplete="off" />
            </label>
            <button class="fullscreen-button" type="button" data-action="fullscreen">进入全屏</button>
            <p>仅用于视觉演示，页面不会连接任何真实校园系统。</p>
            <div class="settings-actions">
              <button class="secondary-button" type="button" data-action="close">取消</button>
              <button class="dialog-confirm" type="submit">确定</button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
